<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدروس - CyberShield</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>

    <nav class="navbar">
        <div class="nav-overlay" id="nav-overlay"></div>
        <div class="container">
            <div class="logo">
                <i class="fas fa-shield-alt"></i>
                <span>CyberShield</span>
            </div>
            <button class="hamburger-btn" id="hamburger-btn">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-links" id="nav-links">
                <a href="/">الرئيسية</a>
                <a href="/lessons" class="active">الدروس</a>
                <a href="/quiz">الاختبارات</a>
                <div id="auth-buttons">
                    <a href="/login" class="btn-login">تسجيل الدخول</a>
                </div>
                <div id="user-menu" style="display: none;">
                    <a href="/profile" class="btn-profile" style="margin-left: 10px;">
                        <i class="fas fa-user"></i>
                        <span id="user-name"></span>
                    </a>
                    <button id="logout-btn" class="btn-logout">تسجيل الخروج</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="lessons-page">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="fas fa-graduation-cap"></i>
                    الدروس التعليمية
                </h1>
                <p>تعلم أساسيات الأمن السيبراني وحماية البيانات الشخصية</p>
            </div>

            <div id="lessons-container" class="lessons-grid">
                <!-- سيتم تحميل الدروس هنا -->
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>جاري تحميل الدروس...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal للدرس -->
    <div id="lesson-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="lesson-content">
                <!-- محتوى الدرس -->
            </div>
        </div>
    </div>

    <script src="js/lessons.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
